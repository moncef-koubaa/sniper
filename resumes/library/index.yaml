# Resume library — one entry per ready-made CV. Read by the cv-library skill and scripts/pick_cv.py.
# Each folder holds: source.tex (LaTeX, rebuilt from the PDF — see logs/decisions.md D-03), source.pdf (compiled
# from source.tex), original.pdf (your own PDF), preview.png.
# To add a CV: create resumes/library/<id>/source.tex (copy the closest one), run
#   python3 scripts/build_cv.py resumes/library/<id> --png
# and add an entry here. Superseded versions (CV08, CV11, CV13) stay in writing-samples/ only.

template: resumes/library/_template/nermine-cv.sty

cvs:
  - id: process_fr
    name: "CV1 Process & Energy Engineering (FR)"
    sample: CV01   # Moumen_Nermine_procédés.pdf, 2026-11-11
    language: fr
    paper: letter
    focus: génie des procédés, simulation de procédés, électrochimie, ACV, TEA
    projects: [P1, P2, P3, P4]
    keywords: [génie des procédés, process engineering, aspen plus, aspen hysys, simulation, reactor, catalytic reactor, langmuir-hinshelwood, optimisation, bilans matière et énergie, pfd, acv, lca, openlca, comsol, ansys fluent, pem, électrolyseur, hydrogène, li-ion, battery, fvm, matlab, thermodynamique, lle, extraction, icp-oes, astm, iso 17025, carburants, fuels]
    best_for: "French process-engineering, process-simulation, EPC/engineering firms, hydrogen and general chemical-engineering PFEs; default FR CV"

